name: farm_manager
description: Offline-first farm management app for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Local database
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # Firebase (Auth + Firestore only — Storage replaced by Cloudinary)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1

  # Cloudinary photo upload
  http: ^1.2.0

  # Background sync
  workmanager: ^0.9.0

  # Photo
  flutter_image_compress: ^2.3.0
  image_picker: ^1.1.2

  # Connectivity
  connectivity_plus: ^6.0.3

  # Utilities
  uuid: ^4.4.2
  intl: 0.20.2
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  custom_lint: 0.7.6
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  generate: true
